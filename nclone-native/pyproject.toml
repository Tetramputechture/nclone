[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "nclone-native"
version = "0.1.0"
description = "Native Rust physics engine for nclone N++ simulator"
requires-python = ">=3.11"
license = "MIT"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "nclone_native"
