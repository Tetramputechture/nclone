[package]
name = "nclone-native"
version = "0.1.0"
edition = "2021"
description = "Native Rust physics engine for nclone N++ simulator"
license = "MIT"

[lib]
name = "nclone_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
rstar = "0.12"

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
# Fat LTO with a single codegen unit: the simulator is one tight call graph
# (tick -> collision -> segment maths) split across many modules, so cross-crate
# inlining is worth more here than build time. `debug = 1` keeps line tables so
# `perf` can attribute samples to source without changing codegen.
lto = "fat"
codegen-units = 1
debug = 1
